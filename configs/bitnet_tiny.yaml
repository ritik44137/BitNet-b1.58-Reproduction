# BitNet-style tiny Transformer (ternary BitLinear on attention + MLP)

model:
  name: bitnet_tiny
  n_layer: 4
  n_embd: 256
  n_head: 4
  block_size: 256
  vocab_size: null
  dropout: 0.1
  bias: true
  use_bitlinear: true
  bitlinear_on_attention: true
  bitlinear_on_mlp: true
  quantize_lm_head: false

data:
  dataset: tinyshakespeare
  data_dir: data/processed
  train_split: 0.9
  seq_len: 256

train:
  seed: 42
  batch_size: 32
  max_steps: 2000
  eval_interval: 100
  sample_interval: 500
  learning_rate: 3.0e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 100
  amp: false
  device: cpu
  out_dir: runs/bitnet_tiny

logging:
  log_dir: runs/bitnet_tiny/logs
  log_quantization_stats: true
